# Render deployment configuration for Exam Scheduler Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: exam-scheduler-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: exam-scheduler-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["*"]'

databases:
  - name: exam-scheduler-db
    plan: free
    databaseName: exam_scheduler
